<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" role="img" aria-label="duga.app"><title>duga.app</title><style>
circle{fill:#14161D}.lit{fill:#2A45E0}
.d0{--dx:-7px;--dy:-9px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.00s infinite}.d1{--dx:3px;--dy:-11px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.09s infinite}.d2{--dx:11px;--dy:-8px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.18s infinite}.d3{--dx:-10px;--dy:2px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.09s infinite}.d4{--dx:0px;--dy:0px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.18s infinite}.d5{--dx:12px;--dy:3px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.27s infinite}.d6{--dx:-8px;--dy:10px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.18s infinite}.d7{--dx:2px;--dy:12px;animation:in 6s cubic-bezier(.2,.7,.2,1) 0.27s infinite}.d8{transform-origin:18.5px 18.5px;animation:pool 6s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes in{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}14%{opacity:1;transform:none}86%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes pool{0%,20%{opacity:0;transform:scale(0)}34%{opacity:1;transform:scale(1.12)}40%{transform:scale(1)}86%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@media (prefers-color-scheme:dark){circle{fill:#EEF0F6}.lit{fill:#7F93FF}}
@media (prefers-reduced-motion:reduce){circle{animation:none!important;opacity:1!important;transform:none!important}}
</style><circle class="d0" cx="3.4" cy="3.4" r="1.8"/><circle class="d1" cx="10.2" cy="3.4" r="1.99"/><circle class="d2" cx="18.5" cy="3.4" r="2.38"/><circle class="d3" cx="3.4" cy="10.2" r="1.99"/><circle class="d4" cx="10.2" cy="10.2" r="2.38"/><circle class="d5" cx="18.5" cy="10.2" r="2.94"/><circle class="d6" cx="3.4" cy="18.5" r="2.38"/><circle class="d7" cx="10.2" cy="18.5" r="2.94"/><circle class="d8 lit" cx="18.5" cy="18.5" r="3.9"/></svg>

      spec = (sp.length - 1) / ((performance.now() - t0) / 1000); same = gen.every((x, j) => sp[j] === x); acc = `${eng.mtp.stats.accepted}/${eng.mtp.stats.drafts}${eng.draftVocab ? ` (small head ${eng._dvSmall ? "on" : "off"})` : ""}`; }
    const r = { prompt, plain: +plain.toFixed(2), spec: spec && +spec.toFixed(2), acceptance: acc, specIdentical: same, golden: g ? (n > 20 && text.slice(0, n) === g.slice(0, n)) : null, text: text.slice(0, 90) };

  }
  if (FILLS.length) {   // prefill speed and decode speed at a long context
    let ids = [];

      out.push(r); log(JSON.stringify(r));
    }
  }
  log(`gpuErrors ${gpuErrors}`);
  window.RESULT = out;
} catch (e) { if (e !== "done") { log("ERROR " + (e.stack || e)); window.RESULT = { error: String(e) }; } }

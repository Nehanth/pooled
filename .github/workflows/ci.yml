name: CI
on:
  push: { branches: [main, feat/engine-opt] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check (engine, room, harness, site, tests incl. unit and e2e, benchmarks)
        run: |
          for f in engine/*.js engine/wgsl/*.js room.js room/*.js harness/*.js site/js/*.js tests/*.js tests/unit/*.js tests/e2e/*.mjs benchmarks/*.js; do node --check "$f"; done
      - name: Unit tests (no GPU)
        # the unit tests import node: builtins via tests/weight_cache.js; without npm ci there is no local
        # node_modules, so Deno must not read package.json (it would look for @types/node there)
        env: { DENO_NO_PACKAGE_JSON: "1" }
        run: deno test --allow-read tests/unit
      - name: Kernel generator sanity
        env: { DENO_NO_PACKAGE_JSON: "1" }
        run: deno run --allow-read tests/unit/generator_smoke.js
  browser:
    # Code mode's preview in headless Chromium, no GPU needed. Optional until it has a track record in CI.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Preview in the browser
        run: node tests/e2e/preview_browser.mjs
